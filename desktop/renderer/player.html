<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stereo</title>
  <link rel="stylesheet" href="styles/player.css">
</head>
<body>
  <!-- Frame Counter -->
  <div id="frameCounter">
    <span id="frameInfo">frame 1</span>
  </div>

  <!-- Canvas -->
  <canvas id="playerCanvas"></canvas>

  <!-- Thumbnails Sidebar -->
  <div id="thumbSidebar">
    <div id="thumbList">
      <!-- Thumbnails populated by JS -->
    </div>
  </div>

  <!-- Bottom Toolbar -->
  <div id="toolbar">
    <button class="tb-btn" id="btnFolder" title="Select Folder">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
      </svg>
    </button>

    <button class="tb-btn" id="btnPrev" title="Previous">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <button class="tb-btn" id="playPauseBtn" title="Play/Pause">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="playIcon">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="pauseIcon" style="display: none;">
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>

    <button class="tb-btn" id="btnNext" title="Next">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button class="tb-btn" id="stopBtn" title="Stop">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="6" y="6" width="12" height="12"/>
      </svg>
    </button>

    <button class="tb-btn" id="btnRecord" title="Record" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="8"/>
      </svg>
    </button>

    <!-- Quick access thumbnails -->
    <button class="tb-btn tb-thumb" id="thumb1" title="Jump to frame 1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>

    <button class="tb-btn tb-thumb" id="thumb2" title="Jump to frame 2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>

    <button class="tb-btn tb-thumb" id="thumb3" title="Jump to frame 3">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>

    <button class="tb-btn tb-thumb" id="thumb4" title="Jump to frame 4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>

    <div class="tb-spacer"></div>

    <button class="tb-btn" id="btnSettings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M5.6 5.6l4.2 4.2m4.2 4.2l4.2 4.2M1 12h6m6 0h6M5.6 18.4l4.2-4.2m4.2-4.2l4.2-4.2"/>
      </svg>
    </button>
  </div>

  <!-- Settings Panel (collapsible) -->
  <div id="settingsPanel">
    <div id="settingsHeader">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6"/>
      </svg>
      <span id="settingsLabel">config</span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="settingsChevron">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
    <div id="settingsBody">
      <div class="setting-row">
        <label class="setting-label">fps</label>
        <input type="range" id="fpsSlider" min="1" max="120" value="60" />
        <span class="setting-value" id="fpsValue">60</span>
      </div>
      <div class="setting-row">
        <label class="setting-label">hold</label>
        <input type="range" id="holdSlider" min="1" max="30" value="6" />
        <span class="setting-value" id="holdValue">6</span>
      </div>
      <div class="setting-row">
        <label class="setting-label">mode</label>
        <div class="mode-btns">
          <button class="mode-btn active" data-mode="fill">fill</button>
          <button class="mode-btn" data-mode="fit">fit</button>
          <button class="mode-btn" data-mode="contain">contain</button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
